spring.application.name=jobhunter

# Cấu hình Database PostgreSQL (Bắt buộc lấy từ ENV)
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Cấu hình Lưu trữ file - Ánh xạ chuẩn sang cụm biến Backblaze B2 độc lập
cloud.aws.credentials.access-key=${B2_ACCESS_KEY_ID}
cloud.aws.credentials.secret-key=${B2_SECRET_ACCESS_KEY}
cloud.aws.region.static=${B2_S3_REGION}
cloud.aws.s3.bucket=${B2_S3_BUCKET_NAME}
cloud.aws.s3.endpoint=${B2_S3_ENDPOINT}

# Cấu hình phát link bảo mật chạy qua CDN Cloudflare 
cloud.aws.cloudfront.domain=${B2_CLOUDFLARE_DOMAIN}
cloud.aws.cloudflare.secret-key=${B2_CLOUDFLARE_SECRET_KEY}
cloud.aws.cloudflare.hls-token-ttl-minutes=180

# Cấu hình JWT bảo mật (Bắt buộc lấy từ ENV)
tandung.jwt.base64-secret=${JWT_SECRET}
tandung.jwt.access-token-validity-in-seconds=8640000
tandung.jwt.refresh-token-validity-in-seconds=8640000


# Cấu hình file upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Cấu hình Pagination
spring.data.web.pageable.one-indexed-parameters=true

# Cấu hình Email bảo mật (Bắt buộc lấy từ ENV)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.output.ansi.enabled=always
